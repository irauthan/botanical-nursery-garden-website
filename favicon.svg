<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09261a"/>
      <stop offset="50%" stop-color="#0e3a27"/>
      <stop offset="100%" stop-color="#061810"/>
    </linearGradient>

    <!-- Leaf Primary Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Secondary Accent Leaf Gradient -->
    <linearGradient id="accentLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Golden Dewdrop / Border Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inner Subtle Border -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Botanical Plant / Leaf Composition -->
  <g filter="url(#glow)">
    <!-- Main Right Leaf -->
    <path d="M32 46 C32 46 48 40 48 24 C48 15 39 15 39 15 C39 23 32 30 32 46 Z" fill="url(#leafGrad)"/>
    
    <!-- Secondary Left Leaf -->
    <path d="M32 46 C32 46 16 38 18 25 C19 18 26 19 28 22 C30 26 31 34 32 46 Z" fill="url(#accentLeafGrad)"/>

    <!-- Central Leaf Vein -->
    <path d="M32 46 C32 37 35 27 39 17" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Left Leaf Vein -->
    <path d="M30 36 C26 31 22 28 20 25" fill="none" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Golden Morning Sunlight / Dew Sparkle -->
    <circle cx="43" cy="18" r="2.5" fill="#fef08a"/>
    <circle cx="43" cy="18" r="1.2" fill="#ffffff"/>
  </g>
</svg>
